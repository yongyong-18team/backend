spring:
  application:
    name: batong
  datasource:
    url: ${DB_URL:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    # 여러 명이 동시에 마이그레이션을 추가하므로 버전 순서가 섞여도 적용한다
    out-of-order: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  forward-headers-strategy: native

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  ai-mode: ${AI_MODE:mock}
  jwt:
    secret: ${JWT_SECRET:}
    access-ttl: ${JWT_ACCESS_TTL:7d}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  share:
    base-url: ${SHARE_BASE_URL:http://localhost:5173}
  admin:
    api-key: ${ADMIN_API_KEY:}
