spring:
  application:
    name: batong
  datasource:
    url: ${DB_URL:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    # 여러 명이 동시에 마이그레이션을 추가하므로 버전 순서가 섞여도 적용한다
    out-of-order: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  forward-headers-strategy: native

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  ai-mode: ${AI_MODE:mock}
  # AI_MODE=live일 때만 쓴다(TRD 8-6, 12-5). 키·모델이 비어 있으면 기동 실패
  llm:
    provider: ${LLM_PROVIDER:gemini}
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:}
    timeout-ms: ${LLM_TIMEOUT_MS:15000}
  # AI_MODE=live일 때만 쓴다(TRD 8-2, 12-5). 키가 비어 있으면 기동 실패. 모델은 TRD 8-2 고정값
  stt:
    provider: ${STT_PROVIDER:groq}
    api-key: ${STT_API_KEY:}
    model: whisper-large-v3
  jwt:
    secret: ${JWT_SECRET:}
    access-ttl: ${JWT_ACCESS_TTL:7d}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  share:
    base-url: ${SHARE_BASE_URL:http://localhost:5173}
  admin:
    api-key: ${ADMIN_API_KEY:}

ai:
  prompt:
    # 사용할 프롬프트 버전. ai_analysis.prompt_version에 기록한다(AI 명세 2-5)
    analyze-diary: v1
