# /etc/nginx/conf.d/batong.conf
# HTTPS(443) 설정은 certbot --nginx 가 이 파일에 자동으로 추가한다.

# 공유 토큰이 접근 로그에 남지 않게 경로를 가린다 (TRD 7-3)
map $request_uri $masked_uri {
    ~^/api/v1/public/shares/[^/?]+(.*)$  /api/v1/public/shares/***$1;
    default                               $request_uri;
}

log_format batong '$remote_addr [$time_local] "$request_method $masked_uri $server_protocol" '
                  '$status $body_bytes_sent $request_time';

server {
    listen 80;
    server_name api.example.com;   # 실제 도메인으로 바꾼다

    access_log /var/log/nginx/batong_access.log batong;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 40s;   # AI 분석 최대 25초 + 여유
    }

    # 외부에는 health만 연다
    location /actuator/ {
        return 404;
    }
    location = /actuator/health {
        proxy_pass http://127.0.0.1:8080;
    }
}
